# 宝塔面板 Nginx 配置 - Laravel 优化版
# 将此配置添加到宝塔面板的站点配置中

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name api.sgex.info;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/api.sgex.info/followplus-main/public;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/api.sgex.info.conf;
    #CERT-APPLY-CHECK--END

    include /www/server/panel/vhost/nginx/extension/api.sgex.info/*.conf;
    
    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/api.sgex.info/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/api.sgex.info/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    error_page 497  https://$host$request_uri;
    #SSL-END

    # 重要：注释掉默认的 404 错误页面，让 Laravel 处理 404
    #error_page 404 /404.html;
    #error_page 502 /502.html;

    # Laravel 路由处理 - 必须放在其他 location 之前
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-83.conf;
    #PHP-INFO-END

    # 优化 PHP-FPM 配置
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-83.sock;  # 根据实际 PHP 版本调整
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    # 注意：如果重写规则文件中有 Laravel 规则，可以保留这行
    # 如果没有，Laravel 路由会通过上面的 location / 块处理
    include /www/server/panel/vhost/rewrite/api.sgex.info.conf;
    #REWRITE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # 静态资源缓存
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    # 隐藏 Nginx 版本信息
    server_tokens off;

    access_log  /www/wwwlogs/api.sgex.info.log;
    error_log  /www/wwwlogs/api.sgex.info.error.log;
}

